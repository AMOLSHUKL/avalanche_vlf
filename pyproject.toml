[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "avalanche-vlf"
version = "1.0.0"
description = "Time-Aware Adaptive Multi-Modal Evidence Fusion Engine for Avalanche SAR"
authors = [{ name = "SIH 2026 Defense SAR Team" }]
license = { text = "Apache-2.0" }
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pyyaml>=6.0.1",
    "numpy>=1.26.4",
    "websockets>=12.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    # pytest-asyncio still calls the policy API removed in Python 3.16;
    # silence until upstream migrates (tracked in .ai/BACKLOG.md).
    "ignore:.*asyncio.get_event_loop_policy.*:DeprecationWarning",
    "ignore:.*asyncio.set_event_loop_policy.*:DeprecationWarning",
]